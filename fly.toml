# Fambot on Fly.io: one app, two processes (api + worker), one Neon database.
#
#   bun run env:setup
#   bun run prod:up

app = "fambot-nrogers"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[processes]
  api = "bun apps/api/src/index.ts"
  worker = "bun apps/worker/src/index.ts"

[env]
  PORT = "8787"
  API_BASE_URL = "https://fambot-nrogers.fly.dev"
  APP_URL = "https://fambot-desktop.vercel.app"

[http_service]
  processes = ["api"]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false   # the bridge keeps a WebSocket open
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
